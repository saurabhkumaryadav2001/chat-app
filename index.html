<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Join screen ── */
    #join-screen {
      background: #16213e;
      border-radius: 16px;
      padding: 40px 32px;
      width: min(90%, 380px);
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
    }
    #join-screen h1 { font-size: 1.6rem; color: #e94560; text-align: center; }
    #join-screen p  { text-align: center; color: #aaa; font-size: .9rem; }
    #join-screen input {
      padding: 12px 16px;
      border-radius: 8px;
      border: 2px solid #0f3460;
      background: #0f3460;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
    }
    #join-screen input:focus { border-color: #e94560; }
    #join-screen button {
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #e94560;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background .2s;
    }
    #join-screen button:hover { background: #c73652; }

    /* ── Chat screen ── */
    #chat-screen {
      display: none;
      width: min(98%, 900px);
      height: min(98dvh, 680px);
      background: #16213e;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
      overflow: hidden;
      flex-direction: row;
    }

    /* Sidebar */
    #sidebar {
      width: 200px;
      background: #0f3460;
      display: flex;
      flex-direction: column;
      padding: 20px 12px;
      gap: 12px;
      flex-shrink: 0;
    }
    #sidebar h2 { font-size: .85rem; text-transform: uppercase; color: #aaa; letter-spacing: .08em; }
    #user-list { list-style: none; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex: 1; }
    #user-list li {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .9rem;
      color: #ddd;
    }
    #user-list li::before {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4caf50;
      flex-shrink: 0;
    }
    #my-name {
      font-size: .8rem;
      color: #e94560;
      margin-top: auto;
      word-break: break-word;
    }

    /* Main chat area */
    #chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #chat-header {
      background: #1a1a2e;
      padding: 14px 20px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #e94560;
      border-bottom: 1px solid #0f3460;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 72%;
    }
    .msg.mine { align-self: flex-end; align-items: flex-end; }
    .msg.other { align-self: flex-start; align-items: flex-start; }

    .msg .meta { font-size: .72rem; color: #888; margin-bottom: 3px; }
    .msg.mine .meta { text-align: right; }

    .msg .bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: .93rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg.mine  .bubble { background: #e94560; color: #fff; border-bottom-right-radius: 4px; }
    .msg.other .bubble { background: #0f3460; color: #e0e0e0; border-bottom-left-radius: 4px; }

    .system-msg {
      text-align: center;
      font-size: .78rem;
      color: #888;
      padding: 2px 0;
    }
    .system-msg.join  { color: #4caf50; }
    .system-msg.leave { color: #f44336; }

    /* Typing indicator */
    #typing-indicator {
      padding: 4px 20px 6px;
      font-size: .78rem;
      color: #888;
      min-height: 20px;
      font-style: italic;
    }

    /* Input row */
    #input-row {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: #1a1a2e;
      border-top: 1px solid #0f3460;
    }
    #msg-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 24px;
      border: 2px solid #0f3460;
      background: #0f3460;
      color: #fff;
      font-size: .95rem;
      outline: none;
      transition: border-color .2s;
    }
    #msg-input:focus { border-color: #e94560; }
    #send-btn {
      padding: 10px 20px;
      border-radius: 24px;
      border: none;
      background: #e94560;
      color: #fff;
      font-size: .95rem;
      cursor: pointer;
      transition: background .2s;
    }
    #send-btn:hover { background: #c73652; }

    @media (max-width: 560px) {
      #sidebar { display: none; }
      #chat-screen { height: 100dvh; border-radius: 0; }
    }
  </style>
</head>
<body>

  <!-- Join screen -->
  <div id="join-screen">
    <h1>💬 Chat App</h1>
    <p>No sign-up needed — just pick a name and start chatting!</p>
    <input id="username-input" type="text" maxlength="24" placeholder="Your name..." autofocus />
    <button id="join-btn">Join Chat</button>
  </div>

  <!-- Chat screen -->
  <div id="chat-screen">
    <div id="sidebar">
      <h2>Online</h2>
      <ul id="user-list"></ul>
      <div id="my-name"></div>
    </div>
    <div id="chat-main">
      <div id="chat-header">💬 Public Chat Room</div>
      <div id="messages"></div>
      <div id="typing-indicator"></div>
      <div id="input-row">
        <input id="msg-input" type="text" maxlength="500" placeholder="Type a message..." />
        <button id="send-btn">Send</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // ── Elements ──
    const joinScreen   = document.getElementById('join-screen');
    const chatScreen   = document.getElementById('chat-screen');
    const usernameInput= document.getElementById('username-input');
    const joinBtn      = document.getElementById('join-btn');
    const messages     = document.getElementById('messages');
    const msgInput     = document.getElementById('msg-input');
    const sendBtn      = document.getElementById('send-btn');
    const userList     = document.getElementById('user-list');
    const typingIndicator = document.getElementById('typing-indicator');
    const myNameLabel  = document.getElementById('my-name');

    let myName = '';
    let typingTimer = null;
    let isTyping = false;

    // ── Join ──
    function joinChat() {
      const name = usernameInput.value.trim();
      if (!name) { usernameInput.focus(); return; }
      myName = name;
      socket.emit('join', name);
      joinScreen.style.display = 'none';
      chatScreen.style.display = 'flex';
      myNameLabel.textContent  = '👤 ' + name;
      msgInput.focus();
    }

    joinBtn.addEventListener('click', joinChat);
    usernameInput.addEventListener('keydown', e => { if (e.key === 'Enter') joinChat(); });

    // ── Send message ──
    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text) return;
      socket.emit('chatMessage', text);
      msgInput.value = '';
      stopTypingSignal();
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

    // ── Typing signals ──
    msgInput.addEventListener('input', () => {
      if (!isTyping) {
        isTyping = true;
        socket.emit('typing');
      }
      clearTimeout(typingTimer);
      typingTimer = setTimeout(stopTypingSignal, 1500);
    });

    function stopTypingSignal() {
      if (isTyping) {
        isTyping = false;
        socket.emit('stopTyping');
      }
      clearTimeout(typingTimer);
    }

    // ── Socket events ──
    socket.on('chatMessage', ({ username, message, time }) => {
      const isMine = username === myName;
      const div = document.createElement('div');
      div.className = 'msg ' + (isMine ? 'mine' : 'other');
      div.innerHTML = `
        <div class="meta">${isMine ? '' : username + ' · '}${time}</div>
        <div class="bubble">${escapeHtml(message)}</div>
      `;
      messages.appendChild(div);
      scrollBottom();
    });

    socket.on('system', ({ message, type }) => {
      const div = document.createElement('div');
      div.className = 'system-msg ' + (type || '');
      div.textContent = message;
      messages.appendChild(div);
      scrollBottom();
    });

    socket.on('userList', (users) => {
      userList.innerHTML = '';
      users.forEach(u => {
        const li = document.createElement('li');
        li.textContent = u;
        userList.appendChild(li);
      });
    });

    let typingClearTimer = null;
    socket.on('typing', ({ username }) => {
      typingIndicator.textContent = `${username} is typing…`;
      clearTimeout(typingClearTimer);
      typingClearTimer = setTimeout(() => { typingIndicator.textContent = ''; }, 3000);
    });

    socket.on('stopTyping', () => {
      clearTimeout(typingClearTimer);
      typingIndicator.textContent = '';
    });

    // ── Helpers ──
    function scrollBottom() {
      messages.scrollTop = messages.scrollHeight;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
